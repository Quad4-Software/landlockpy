[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landlockpy"
dynamic = ["version"]
description = "Python bindings for the Landlock Linux security module"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
authors = [{ name = "Quad4" }]
keywords = ["landlock", "lsm", "sandbox", "security", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://quad4.io"
Repository = "https://github.com/Quad4-Software/landlockpy"
Documentation = "https://docs.kernel.org/userspace-api/landlock.html"

[tool.hatch.version]
path = "src/landlockpy/__init__.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "bandit>=1.9.4",
    "mypy>=2.3.1",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PTH", "C90", "RUF", "TRY"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "enforced: tests that apply a Landlock ruleset in a child process",
]
