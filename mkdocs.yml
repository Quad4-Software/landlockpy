site_name: landlockpy
site_description: Python bindings for the Landlock Linux security module
site_url: https://quad4-software.github.io/landlockpy/
repo_url: https://github.com/Quad4-Software/landlockpy
copyright: Copyright Quad4, licensed 0BSD

theme:
  name: material
  features:
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true

nav:
  - Home: index.md
  - API reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
